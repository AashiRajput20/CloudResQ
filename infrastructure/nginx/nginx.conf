worker_processes 1;
events { worker_connections 256; }

http {
    log_format cloudresq '$remote_addr "$request" $status upstream=$upstream_addr time=$request_time';
    access_log /dev/stdout cloudresq;
    error_log  /dev/stderr warn;

    # The list of backend servers is generated by CloudResQ (backend/loadbalancer).
    include /etc/nginx/conf.d/upstream.conf;

    server {
        listen 80;

        # Answers without touching the apps: tells you Nginx itself is alive.
        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            proxy_pass http://cloudresq_backend;   # round-robin over the active pool
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Connection "";

            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;

            # If one instance fails to answer, try one more. The user never sees it.
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 2;
        }
    }
}