# Prometheus scrapes two things:
#  1. the CloudResQ backend (decisions, recoveries, CPU/memory per instance, ...)
#  2. every running app container, found through CloudResQ's own service discovery endpoint,
#     so new instances (app-4, app-5 ...) are picked up automatically.
global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: cloudresq-backend
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:5000']   # the backend runs on the laptop, outside Docker

  - job_name: cloudresq-apps
    metrics_path: /metrics
    http_sd_configs:
      - url: http://host.docker.internal:5000/api/prometheus/targets
        refresh_interval: 10s