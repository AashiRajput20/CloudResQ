# Shared settings for every demo-app instance
x-demo-app: &demo-app
  image: cloudresq-app
  build: ./demo-app
  restart: "no"          # CloudResQ decides recovery, not Docker
  networks:
    - cloudresq-net
  mem_limit: 256m
  cpus: 1.0

services:
  mongo:
    image: mongo:7
    container_name: cloudresq-mongo
    # Cap MongoDB's cache to save RAM on an 8 GB laptop
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - cloudresq-net
    restart: unless-stopped

  nginx:
    image: nginx:latest          # already on your laptop, so no download
    container_name: cloudresq-nginx
    # Reset the backend list to the placeholder on every start; CloudResQ refills it.
    command:
      - /bin/sh
      - -c
      - "cp /etc/nginx/upstream.placeholder /etc/nginx/conf.d/upstream.conf && exec nginx -g 'daemon off;'"
    ports:
      - "8080:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/upstream.placeholder.conf:/etc/nginx/upstream.placeholder:ro
    networks:
      - cloudresq-net
    mem_limit: 64m
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: cloudresq-redis
    # Pub/sub needs no disk persistence; cap memory for the 8 GB laptop.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "32mb"]
    ports:
      - "6379:6379"
    networks:
      - cloudresq-net
    mem_limit: 64m
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: cloudresq-prometheus
    profiles: ["monitoring"]          # only starts with: docker compose --profile monitoring up -d
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=1d
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"   # lets the container reach the backend on your laptop
    networks:
      - cloudresq-net
    mem_limit: 384m
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    container_name: cloudresq-grafana
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"      # demo only: anyone can view without logging in
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: dark
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/cloudresq.json
    ports:
      - "3030:3000"
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - cloudresq-net
    mem_limit: 512m
    restart: unless-stopped

  app-1:
    <<: *demo-app
    container_name: cloudresq-app-1
    environment:
      INSTANCE_ID: app-1
      PORT: "3000"
    ports:
      - "3001:3000"
    labels:
      cloudresq.managed: "true"
      cloudresq.service: "demo-service"
      cloudresq.instance: "app-1"
  app-2:
    <<: *demo-app
    container_name: cloudresq-app-2
    environment:
      INSTANCE_ID: app-2
      PORT: "3000"
    ports:
      - "3002:3000"
    labels:
      cloudresq.managed: "true"
      cloudresq.service: "demo-service"
      cloudresq.instance: "app-2"

  app-3:
    <<: *demo-app
    container_name: cloudresq-app-3
    environment:
      INSTANCE_ID: app-3
      PORT: "3000"
    ports:
      - "3003:3000"
    labels:
      cloudresq.managed: "true"
      cloudresq.service: "demo-service"
      cloudresq.instance: "app-3"

networks:
  cloudresq-net:
    name: cloudresq-net

volumes:
  mongo-data:
    name: cloudresq-mongo-data
    external: true   # reuse the volume from your earlier standalone Mongo container
  prometheus-data:
    name: cloudresq-prometheus-data
  grafana-data:
    name: cloudresq-grafana-data