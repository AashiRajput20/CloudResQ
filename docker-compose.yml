# Shared settings for every demo-app instance
x-demo-app: &demo-app
  image: cloudresq-app
  build: ./demo-app
  restart: "no"          # CloudResQ decides recovery, not Docker
  networks:
    - cloudresq-net
  mem_limit: 256m
  cpus: 1.0

services:
  mongo:
    image: mongo:7
    container_name: cloudresq-mongo
    # Cap MongoDB's cache to save RAM on an 8 GB laptop
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - cloudresq-net
    restart: unless-stopped

  nginx:
    image: nginx:latest          # already on your laptop, so no download
    container_name: cloudresq-nginx
    # Reset the backend list to the placeholder on every start; CloudResQ refills it.
    command:
      - /bin/sh
      - -c
      - "cp /etc/nginx/upstream.placeholder /etc/nginx/conf.d/upstream.conf && exec nginx -g 'daemon off;'"
    ports:
      - "8080:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/upstream.placeholder.conf:/etc/nginx/upstream.placeholder:ro
    networks:
      - cloudresq-net
    mem_limit: 64m
    restart: unless-stopped
  app-1:
    <<: *demo-app
    container_name: cloudresq-app-1
    environment:
      INSTANCE_ID: app-1
      PORT: "3000"
    ports:
      - "3001:3000"
    labels:
      cloudresq.managed: "true"
      cloudresq.service: "demo-service"
      cloudresq.instance: "app-1"

  app-2:
    <<: *demo-app
    container_name: cloudresq-app-2
    environment:
      INSTANCE_ID: app-2
      PORT: "3000"
    ports:
      - "3002:3000"
    labels:
      cloudresq.managed: "true"
      cloudresq.service: "demo-service"
      cloudresq.instance: "app-2"

  app-3:
    <<: *demo-app
    container_name: cloudresq-app-3
    environment:
      INSTANCE_ID: app-3
      PORT: "3000"
    ports:
      - "3003:3000"
    labels:
      cloudresq.managed: "true"
      cloudresq.service: "demo-service"
      cloudresq.instance: "app-3"

networks:
  cloudresq-net:
    name: cloudresq-net

volumes:
  mongo-data:
    name: cloudresq-mongo-data
    external: true   # reuse the volume from your earlier standalone Mongo container